name: CI

on:
  push:
    branches: [main, push-to-github]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + build + test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Explicit include list instead of a full os × node cross product:
      # Windows only needs one representative cell (it guards path/shell/glob
      # regressions), so we run ubuntu×{22,24} + windows×{24} = 3 cells to
      # keep CI fast rather than 4.
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (host + client)
        run: npm run typecheck

      - name: Build (lib/host.js + lib/client.js)
        run: npm run build

      - name: Unit tests
        run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
